name: Weekly SEO metrics

# Appends one dated record to seo-engine/history.json so AI mentions, keyword
# positions and indexed page count become a trend rather than a one-off number.
# No AI involved — pure API calls, roughly $0.30 a run.

on:
  schedule:
    - cron: '0 12 * * 1' # Mondays 12:00 UTC ≈ 7:00 AM Central
  workflow_dispatch: # run on demand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect metrics
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node seo-engine/collect-metrics.mjs

      - name: Commit the new record
        run: |
          if git diff --quiet -- seo-engine/history.json; then
            echo "No change to history.json — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-engine/history.json
          git commit -m "SEO metrics: $(date -u +%Y-%m-%d)"
          git push
