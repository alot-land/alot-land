      - label: "Videos Page"
        name: "videos"
        file: "src/content/settings/videos.json"
        fields:
          - { label: "Featured Video URL (optional)", name: "featuredVideoUrl", widget: "string", required: false, hint: "Paste a YouTube link to pin it as the big video at the top of /videos. Leave blank to feature your newest upload automatically." }
          - { label: "Featured Video Caption (optional)", name: "featuredVideoNote", widget: "string", required: false, hint: "A short line shown under the featured video. Leave blank to use the video's own title." }
      - label: "Homepage Settings"
        name: "homepage"
        file: "src/content/settings/homepage.json"
        fields:
          - { label: "YouTube Video ID", name: "homepageVideoId", widget: "string", required: false, hint: "The ID from your YouTube URL e.g. lR3ZteyGK14 from youtube.com/watch?v=lR3ZteyGK14" }
          - { label: "Hero Tagline", name: "heroTagline", widget: "string", required: false, hint: "e.g. Off-market deals in Arizona, Tennessee & Arkansas." }
      - label: "Sugar Tree Vista"
        name: "sugar-tree"
        file: "src/content/settings/sugar-tree.json"
        fields:
          - { label: "One-Day Sale Date", name: "saleDate", widget: "datetime", hint: "The countdown on the Sugar Tree Vista page counts down to this date/time." }
          - { label: "Hero Video URL (YouTube or Vimeo)", name: "heroVideoUrl", widget: "string", required: false, hint: "Paste a link to embed the walkthrough video in the hero. Leave blank to hide it." }
          - { label: "Show Hero Video", name: "showHeroVideo", widget: "boolean", default: true, required: false, hint: "Toggle off to hide the hero video on the sales page without deleting the URL." }
          - { label: "GHL — Showing Calendar URL", name: "showingCalendarUrl", widget: "string", required: false, hint: "Paste the GHL 'Book a Showing' calendar link. When set, the button opens it in a popup. Blank = button calls/texts you instead." }
          - { label: "GHL — Land Consult Calendar URL", name: "consultCalendarUrl", widget: "string", required: false, hint: "Paste the GHL '20-Minute Land Call' calendar link. When set, the button opens it in a popup. Blank = button calls/texts you instead." }
          - { label: "GHL — Area Guide Email Form URL", name: "areaGuideFormUrl", widget: "string", required: false, hint: "Paste the GHL email-capture form link. When set, the Area Guide button opens the form in a popup (set the form to redirect to the PDF after submit). Blank = PDF downloads directly." }
          - { label: "Show Financing Section", name: "showFinancing", widget: "boolean", default: true, required: false, hint: "Toggle off to hide the whole Financing section (and its nav link) from the sales page without deleting it." }
          - { label: "Show Fly & Buy Credit", name: "showFlyBuy", widget: "boolean", default: true, required: false, hint: "Toggle off to hide all $1,500 Fly & Buy Credit mentions (hero pill, the section, the perk, and the legal note)." }
          - { label: "Hero Background Photo", name: "heroImage", widget: "image", required: false, hint: "Optional drone/landscape photo behind the hero headline. Leave blank for the navy background." }
          - { label: "Land Guide Photo (David)", name: "guidePhoto", widget: "image", required: false, hint: "Headshot for the 'Your Land Guide' section." }
          - { label: "Developer Photo", name: "developerPhoto", widget: "image", required: false, hint: "Photo for the 'The Developer' section." }
          - { label: "Social Share Image (og:image, 1200×630)", name: "ogImage", widget: "image", required: false, hint: "Image shown when the page is shared on Facebook/LinkedIn/X." }
          - { label: "Gallery Photos", name: "galleryPhotos", widget: "list", required: false, field: { label: "Photo", name: "photo", widget: "image" }, hint: "Photos for the 'Property Photos' gallery near the bottom of the page." }
